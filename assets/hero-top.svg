<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="860" height="186" viewBox="0 0 860 186" role="img" aria-label="Daniele Casciani">
  <defs>
    <linearGradient id="dc-hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="54%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    
    <radialGradient id="dc-hero-orb-0" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.72"/>
      <stop offset="58%" stop-color="#58a6ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dc-hero-orb-1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39d353" stop-opacity="0.5"/>
      <stop offset="58%" stop-color="#39d353" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#39d353" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dc-hero-orb-2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a371f7" stop-opacity="0.72"/>
      <stop offset="58%" stop-color="#a371f7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dc-hero-orb-3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="58%" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dc-hero-orb-4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.72"/>
      <stop offset="58%" stop-color="#3b82f6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dc-hero-orb-5" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7ee787" stop-opacity="0.5"/>
      <stop offset="58%" stop-color="#7ee787" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7ee787" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dc-hero-shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e6edf3" stop-opacity="0.2"/>
      <stop offset="44%" stop-color="#58a6ff" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#8b949e" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="dc-hero-holo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e6edf3"/>
      <stop offset="18%" stop-color="#0d1117"/>
      <stop offset="38%" stop-color="#58a6ff"/>
      <stop offset="58%" stop-color="#8b949e"/>
      <stop offset="78%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#e6edf3"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 0.5 0.5" to="360 0.5 0.5" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <style>
    #dc-hero .aura-orb-a { animation: dc-hero-float-a 9s ease-in-out infinite; }
    #dc-hero .aura-orb-b { animation: dc-hero-float-b 11s ease-in-out infinite 1.1s; }
    #dc-hero .aura-orb-c { animation: dc-hero-float-c 13s ease-in-out infinite 0.6s; }
    #dc-hero .aura-ring { animation: dc-hero-ring 8s ease-in-out infinite; }
    #dc-hero .aura-ring-b { animation: dc-hero-ring 10s ease-in-out infinite 1.6s; }
    #dc-hero .aura-chip { animation: dc-hero-chip 650ms ease-out both; }
    #dc-hero .aura-cursor { animation: dc-hero-cursor 1.1s step-end infinite; }
    #dc-hero .aura-bar { animation: dc-hero-bar 1.15s ease-out both; transform-box: fill-box; transform-origin: left; }
    #dc-hero .aura-cell { animation: dc-hero-cell 520ms ease-out both; }
    @keyframes dc-hero-cell { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes dc-hero-float-a { 0%,100% { transform: translate(0,0); opacity: .58; } 50% { transform: translate(28px,-20px); opacity: .86; } }
    @keyframes dc-hero-float-b { 0%,100% { transform: translate(0,0); opacity: .42; } 50% { transform: translate(-24px,18px); opacity: .72; } }
    @keyframes dc-hero-float-c { 0%,100% { transform: translate(0,0) scale(1); opacity: .34; } 50% { transform: translate(18px,-12px) scale(1.18); opacity: .62; } }
    @keyframes dc-hero-ring { 0%,100% { opacity: .06; } 50% { opacity: .22; } }
    @keyframes dc-hero-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes dc-hero-cursor { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes dc-hero-bar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  </style>
  <g id="dc-hero">
    <rect width="860" height="274" rx="20" fill="url(#dc-hero-bg)"/>
    <ellipse class="aura-orb-a" cx="138" cy="36" rx="206" ry="92" fill="url(#dc-hero-orb-0)"/>
    <ellipse class="aura-orb-b" cx="654" cy="44" rx="241" ry="84" fill="url(#dc-hero-orb-1)"/>
    <ellipse class="aura-orb-c" cx="499" cy="250" rx="310" ry="68" fill="url(#dc-hero-orb-2)"/>
    <ellipse class="aura-orb-b" cx="826" cy="230" rx="172" ry="84" fill="url(#dc-hero-orb-3)"/>
    <rect x="26" y="24" width="808" height="226" rx="20" fill="rgba(8,8,12,0.5)" stroke="#58a6ff" stroke-opacity="0.5"/>
    <circle class="aura-ring" cx="735" cy="106" r="30.2" fill="none" stroke="#e6edf3" stroke-opacity="0.36"/>
    <circle class="aura-ring-b" cx="735" cy="106" r="52.1" fill="none" stroke="#e6edf3" stroke-opacity="0.22"/>
    <circle class="aura-ring" cx="735" cy="106" r="69.6" fill="none" stroke="#e6edf3" stroke-opacity="0.14"/>
    <g transform="rotate(-32 735 106)"><circle cx="787.1" cy="106" r="4" fill="#58a6ff">
      <animate attributeName="r" values="3.4;4.8;3.4" dur="1.6s" repeatCount="indefinite"/></circle></g>
    <clipPath id="dc-hero-av"><circle cx="96" cy="98" r="45"/></clipPath>
    <circle cx="96" cy="98" r="48" fill="rgba(255,255,255,0.06)" stroke="#58a6ff" stroke-opacity="0.85" stroke-width="2"/>
    <image xlink:href="data:image/png;base64," x="51" y="53" width="90" height="90" clip-path="url(#dc-hero-av)" preserveAspectRatio="xMidYMid slice"/>
    <path d="M166 76 C246 50 330 50 410 77" fill="none" stroke="url(#dc-hero-shine)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <text x="166" y="69" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="800" fill="#8b949e" letter-spacing="2.6">@daniele-casciani</text>
    <text x="166" y="122" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="46" font-weight="850" fill="#e6edf3" letter-spacing="-1.5">Daniele Casciani</text>
    <text x="168" y="152" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="600" fill="#c9d1d9" >Full-stack engineer @ GenoGra — GPU-accelerated pangenomics</text>
    <text x="168" y="173" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="500" fill="#8b949e" >M.Sc. Computer Science &amp; Engineering (AI) @ Politecnico di Milano</text>
    <g>
      <rect x="46" y="190" width="173" height="46" rx="23" fill="rgba(8,8,12,0.5)" stroke="url(#dc-hero-holo)" stroke-width="2"/>
      <rect x="47" y="191" width="171" height="44" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.22"/>
      <circle cx="73" cy="213" r="12" fill="#ffffff" fill-opacity="0.16"/>
      <text x="73" y="218" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">in</text>
      <text x="94" y="209" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="850" fill="#8b949e" letter-spacing="1.2">LinkedIn</text>
      <text x="94" y="225" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="800" fill="#e6edf3" >danielecasciani</text></g>
    <g>
      <rect x="231" y="190" width="137" height="46" rx="23" fill="rgba(8,8,12,0.5)" stroke="url(#dc-hero-holo)" stroke-width="2"/>
      <rect x="232" y="191" width="135" height="44" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.22"/>
      <circle cx="258" cy="213" r="12" fill="#ffffff" fill-opacity="0.16"/>
      <text x="258" y="218" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">G</text>
      <text x="279" y="209" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="850" fill="#8b949e" letter-spacing="1.2">GitHub</text>
      <text x="279" y="225" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="800" fill="#e6edf3" >@GenoGra</text></g>
    <rect x="0.5" y="0.5" width="859" height="273" rx="19.5" fill="none" stroke="#58a6ff" stroke-opacity="0.62"/>
