  <style>
    #dc-stack .aura-orb-a { animation: dc-stack-float-a 9s ease-in-out infinite; }
    #dc-stack .aura-orb-b { animation: dc-stack-float-b 11s ease-in-out infinite 1.1s; }
    #dc-stack .aura-orb-c { animation: dc-stack-float-c 13s ease-in-out infinite 0.6s; }
    #dc-stack .aura-ring { animation: dc-stack-ring 8s ease-in-out infinite; }
    #dc-stack .aura-ring-b { animation: dc-stack-ring 10s ease-in-out infinite 1.6s; }
    #dc-stack .aura-chip { animation: dc-stack-chip 650ms ease-out both; }
    #dc-stack .aura-cursor { animation: dc-stack-cursor 1.1s step-end infinite; }
    #dc-stack .aura-bar { animation: dc-stack-bar 1.15s ease-out both; transform-box: fill-box; transform-origin: left; }
    #dc-stack .aura-cell { animation: dc-stack-cell 520ms ease-out both; }
    @keyframes dc-stack-cell { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes dc-stack-float-a { 0%,100% { transform: translate(0,0); opacity: .58; } 50% { transform: translate(28px,-20px); opacity: .86; } }
    @keyframes dc-stack-float-b { 0%,100% { transform: translate(0,0); opacity: .42; } 50% { transform: translate(-24px,18px); opacity: .72; } }
    @keyframes dc-stack-float-c { 0%,100% { transform: translate(0,0) scale(1); opacity: .34; } 50% { transform: translate(18px,-12px) scale(1.18); opacity: .62; } }
    @keyframes dc-stack-ring { 0%,100% { opacity: .06; } 50% { opacity: .22; } }
    @keyframes dc-stack-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes dc-stack-cursor { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes dc-stack-bar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  </style>
